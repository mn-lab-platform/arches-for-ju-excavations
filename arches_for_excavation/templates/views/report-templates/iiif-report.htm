{% extends "views/report-templates/default.htm" %}
{% load i18n %}

{% block head %}
<style>
  .rp-report-section {
    min-height: 70vh;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .rp-report-section > h3 {
    color: rgb(67, 137, 201);
  }

  .rp-map-wrap {
    /* klucz: wrapper ma mieć realną wysokość */
    min-height: 650px;
    height: 650px;

    position: relative;
    border: 1px solid rgb(221, 221, 221);
    border-radius: 10px;
    overflow: hidden;
    background: rgb(235, 238, 240);
    box-shadow: 0 18px 36px rgba(67, 137, 201, 0.12);
  }

  .rp-msg {
    font-size: 12px;
    color: rgb(67, 137, 201);
    padding: 8px 10px;
    border: 1px dashed rgb(221, 221, 221);
    border-radius: 8px;
    background: rgb(248, 248, 248);
  }
  .rp-err { color: rgb(67, 137, 201); }
</style>
{% endblock head %}
