<style>
.coord-transformation-plugin-container {
    width: 100%;
    height: 100%;
    
    display: grid;
    grid-template-columns: 50% 1fr;
    grid-template-rows: 55% 1fr;
}

.coord-transformation-plugin-container .text-input-container {
    grid-column: 1;
    grid-row: 1 / span 2;

    padding: 1rem;
}

.coord-transformation-plugin-container .map-container {
    grid-column: 2;

    border-bottom: 1px solid #ddd;
}

.coord-transformation-plugin-container .crs-controls-container {
    grid-column: 2;
}

.text-input-container {
    display: flex;
    flex-direction: column;
    gap: 1rem;

    border-right: 1px solid #ddd;
}

.text-input-container .coord-status-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.editable-textarea {
    width: 100%;
    height: 100%;

    resize: none;
    font-family: "Fira Mono", "Consolas", "Menlo", "Monaco", "Liberation Mono", "Courier New", monospace;
    font-weight: 600;
    font-size: 1.5rem;
    line-height: 1.8rem;

    border-radius: 2px;
    padding: 1rem;

    overflow: auto;
    white-space: pre-wrap;
    word-wrap: break-word;

    outline: none;
    border: 1px solid #ccc;
}

.crs-controls-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;

    padding: 1rem;
}

.crs-menu-container {
    width: 100%;
    display: flex;
    
}

</style>
<div class="coord-transformation-plugin-container">
    <div class="text-input-container">
        <div class="coord-status-container">
            <div class="coord-status-message-container">
                <span data-bind="text: statusMessage"></span>
            </div>
            <div class="coord-controls-container">
                <button>
                    <i class="fa fa-home"></i>
                </button>
                <button data-bind="click: reorderCoordinates">
                    <i class="fa fa-exchange"></i>
                </button>
                <button>
                    <i class="fa fa-copy"></i>
                </button>
            </div>
        </div>
        <div class="editable-textarea" 
             contenteditable="plaintext-only" 
             data-bind="html: coordinatesHtml, event: { input: handleCoordinatesInput }">
        </div>
    </div>

    <div class="map-container">
        
    </div>

    <div class="crs-controls-container">
        <button class="compute-crs-button">
            Compute & Display
        </button>
        <div class="crs-menu-container">
            <div class="crs-menu">
                
            </div>
            <div class="crs-menu">
                
            </div>
        </div>
    </div>
</div>
