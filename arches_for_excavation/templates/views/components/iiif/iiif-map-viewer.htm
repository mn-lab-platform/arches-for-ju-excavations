<link href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" rel="stylesheet" />

<div class="iiif-map-root" style="position:relative; width:100%; height:100%;">
  <!-- ko if: error -->
  <div style="position:absolute; z-index:5; left:10px; right:10px; top:10px; background:#fff; border:1px solid #b00020; color:#b00020; padding:8px 10px; border-radius:8px; font-size:12px;">
    <b>Viewer error:</b> <span data-bind="text: error"></span>
  </div>
  <!-- /ko -->

  <!-- ko if: status -->
  <div style="position:absolute; z-index:5; left:10px; top:10px; background:#fff; border:1px solid #ddd; color:#333; padding:6px 10px; border-radius:8px; font-size:12px;">
    <span data-bind="text: status"></span>
  </div>
  <!-- /ko -->

  <div data-bind="iiifMapInit: initMap" style="width:100%; height:650px; background:#e9e9e9;"></div>

  <div style="position:absolute; z-index:1; left:10px; bottom:10px; background:#fff; border:1px solid #ddd; padding:8px 10px; border-radius:8px; max-width:360px;">
    <!-- ko if: layers().length -->
    <div style="font-size:12px; font-weight:600; margin-bottom:6px;">Layers</div>
    <!-- /ko -->

    <!-- ko foreach: layers -->
      <div style="display:flex; gap:8px; align-items:center; margin:4px 0;">
        <label style="margin:0; font-size:12px; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
          <input type="checkbox" data-bind="checked: visible" />
          <span data-bind="text: label"></span>
        </label>
        <input
          type="range"
          min="0"
          max="1"
          step="0.05"
          style="width:110px"
          data-bind="value: opacity, valueUpdate: 'input', enable: visible" />
      </div>
    <!-- /ko -->

    <div style="display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;">
      <button class="btn btn-xs btn-default" data-bind="click: fit, enable: layers().length">Fit</button>
      <button class="btn btn-xs btn-default" data-bind="click: toggleMeasure, css: { active: measureMode }">
        <span data-bind="text: measureMode() ? 'Wyłącz pomiar' : 'Mierz odległość'"></span>
      </button>
      <button class="btn btn-xs btn-default" data-bind="click: clearMeasure, enable: measureMode">Wyczyść</button>
    </div>

    <!-- ko if: measureDistance -->
    <div style="font-size:12px; margin-top:6px;">
      Dystans: <b data-bind="text: measureDistance"></b>
    </div>
    <!-- /ko -->
  </div>
</div>
