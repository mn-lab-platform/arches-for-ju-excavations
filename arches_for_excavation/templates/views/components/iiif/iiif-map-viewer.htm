<link href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" rel="stylesheet" />
<link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet" />

<div class="iiif-map-root" style="position:relative; width:100%; height:100%;">

  <div data-bind="iiifMapInit: initMap" style="position:relative; width:100%; height:650px; background:#e9e9e9;">
    <div
      class="iiif-maplibre-container"
      style="position:absolute; inset:0;"
      data-bind="style: { display: renderMode() === 'map' ? 'block' : 'none' }">
    </div>

    <div
      class="iiif-leaflet-container"
      style="position:absolute; inset:0;"
      data-bind="style: { display: renderMode() === 'image' ? 'block' : 'none' }">
    </div>

    <!-- ONE CONTROL PANEL (ALWAYS ON TOP) -->
    <div style="position:absolute; z-index:600; left:10px; bottom:10px; background:#fff; border:1px solid #ddd; padding:8px 10px; border-radius:8px; max-width:380px; pointer-events:auto;">
      <div style="display:flex; gap:8px; align-items:center; justify-content:space-between;">
        <div style="font-size:12px; font-weight:700;">
          <span data-bind="text: renderMode() === 'map' ? 'Map mode (georeferenced)' : 'Image-only mode (Leaflet CRS.Simple)'"></span>
         </div>
        <button class="btn btn-xs btn-default"
                data-bind="click: toggleRenderMode, enable: canToggleRenderMode">
          Toggle
        </button>
      </div>

      <!-- ko if: fallbackReason -->
      <div style="font-size:12px; margin-top:6px; color:#555;">
        <span data-bind="text: fallbackReason"></span>
      </div>
      <!-- /ko -->

      <!-- ================= MAP CONTROLS ================= -->
      <!-- ko if: renderMode() === 'map' -->
        <!-- ko if: layers().length -->
        <div style="font-size:12px; font-weight:600; margin:10px 0 6px;">Layers</div>
        <!-- /ko -->

        <!-- ko foreach: layers -->
          <div style="display:flex; gap:8px; align-items:center; margin:4px 0;">
            <label style="margin:0; font-size:12px; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
              <input type="checkbox" data-bind="checked: visible" />
              <span data-bind="text: label"></span>
            </label>
            <input
              type="range"
              min="0"
              max="1"
              step="0.05"
              style="width:110px"
              data-bind="value: opacity, valueUpdate: 'input', enable: visible" />
          </div>
        <!-- /ko -->

        <div style="display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;">
          <button class="btn btn-xs btn-default" data-bind="click: fit, enable: layers().length">Zoom to Layers</button>
          <button class="btn btn-xs btn-default" data-bind="click: toggleMeasure, css: { active: measureMode }">
            <span data-bind="text: measureMode() ? 'Disable Measure' : 'Measure Distance'"></span>
          </button>
          <button class="btn btn-xs btn-default" data-bind="click: clearMeasure, enable: measureMode">Clear</button>
          <button class="btn btn-xs btn-default" data-bind="click: toggleElevation, css: { active: elevationMode }, enable: !measureMode()">
            <span data-bind="text: elevationMode() ? 'Measure height: ON' : 'Measure height: OFF'"></span>
          </button>
        </div>

        <!-- ko if: measureDistance -->
        <div style="font-size:12px; margin-top:6px;">
          Measure Distance: <b data-bind="text: measureDistance"></b>
        </div>
        <!-- /ko -->

        <!-- ko if: measureCoords -->
        <div style="font-size:12px; margin-top:4px;">
          Coords: <b data-bind="text: measureCoords"></b>
        </div>
        <!-- /ko -->

        <!-- ko if: elevationMode -->
        <div style="font-size:12px; margin-top:6px;">
          Click on map to see height.
        </div>
        <!-- /ko -->

        <!-- ko if: elevationLoading -->
        <div style="font-size:12px; margin-top:4px;">Loading elevation…</div>
        <!-- /ko -->

        <!-- ko if: elevationValue -->
        <div style="font-size:12px; margin-top:4px;">
          Elevation: <b data-bind="text: elevationValue"></b>
        </div>
        <!-- /ko -->

        <!-- ko if: elevationError -->
        <div style="font-size:12px; margin-top:4px; color:#b00020;" data-bind="text: elevationError"></div>
        <!-- /ko -->

        <!-- ko if: clickedCoords -->
          <div style="font-size:12px; margin-top:4px;">
            Clicked coords: <b data-bind="text: clickedCoords"></b>
          </div>
        <!-- /ko -->
      <!-- /ko -->

      <!-- ================= IMAGE CONTROLS ================= -->
      <!-- ko if: renderMode() === 'image' -->
        <div style="display:flex; gap:8px; align-items:center; justify-content:space-between; margin:10px 0 6px;">
          <div style="font-size:12px; font-weight:600;">
            <span data-bind="text: imageGroup() === 'dem' ? 'Reference canvas (DEM family, locked)' : 'Reference canvas (Ortho, locked)'"></span>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-xs btn-default"
                    data-bind="click: () => setImageGroup('ortho'), css: { active: imageGroup() === 'ortho' }">
              ORTO
            </button>
            <button class="btn btn-xs btn-default"
                    data-bind="click: () => setImageGroup('dem'), css: { active: imageGroup() === 'dem' }">
              DEM
            </button>
          </div>
        </div>

        <select class="form-control input-sm"
                style="width:100%; max-width:360px; background:#f5f5f5;"
                disabled
                data-bind="
                  options: leafletCanvasOptions,
                  optionsText: 'label',
                  optionsValue: 'id',
                  value: leafletBaseCanvasId
                ">
        </select>


        <div style="font-size:12px; margin-top:4px; color:#333;"
             data-bind="text: 'Overlays: ' + leafletLayers().length + ' total'">
        </div>

        <!-- ko if: leafletLayers().length -->
        <div style="font-size:12px; font-weight:600; margin:10px 0 6px;">Overlays</div>
        <!-- /ko -->

        <!-- ko ifnot: leafletLayers().length -->
        <div style="font-size:12px; margin-top:8px; color:#777;">
          Brak overlayów do wyświetlenia.
        </div>
        <!-- /ko -->

        <!-- ko foreach: leafletLayers -->  
          <div style="display:flex; gap:8px; align-items:center; margin:4px 0;">
            <label style="margin:0; font-size:12px; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
              <input type="checkbox" data-bind="checked: visible" />
              <span data-bind="text: label"></span>
            </label>
            <input
              type="range"
              min="0"
              max="1"
              step="0.05"
              style="width:110px"
              data-bind="value: opacity, valueUpdate: 'input', enable: visible" />
          </div>
        <!-- /ko -->

        <!-- ko if: clickedCoords -->
        <div style="font-size:12px; margin-top:4px;">
          Clicked coords: <b data-bind="text: clickedCoords"></b>
        </div>
        <!-- /ko -->
        <div style="font-size:12px; margin-top:6px; color:#333;">
          Active tool:
          <b data-bind="text: activeImageTool() === 'none' ? 'none' : activeImageTool()"></b>
        </div>
        <div style="display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;">
          <!-- ko if: annotationEnabled -->
          <button class="btn btn-xs btn-default"
                  data-bind="click: toggleAnnotationMode, css: { active: annotationMode }">
            <span data-bind="text: annotationMode() ? 'Disable Annotation' : 'Annotate'"></span>
          </button>
          <button class="btn btn-xs btn-success"
                  data-bind="click: finishAnnotation, enable: annotationMode() && annotationCanFinish()">
            Finish
          </button>
          <button class="btn btn-xs btn-default"
                  data-bind="click: cancelAnnotation, enable: annotationMode()">
            Cancel
          </button>
          <!-- /ko -->
          <button class="btn btn-xs btn-default"
                  data-bind="click: toggleLeafletMeasure, css: { active: leafletMeasureMode }">
            <span data-bind="text: leafletMeasureMode() ? 'Disable Measure' : 'Measure Distance'"></span>
          </button>
          <button class="btn btn-xs btn-primary"
                  data-bind="click: toggleLeafletDemPick, css: { active: leafletDemPickMode }">
            <span data-bind="text: leafletDemPickMode() ? 'Click on map to sample DEM' : 'Measure DEM value'"></span>
          </button>
          <button class="btn btn-xs btn-default"
                  data-bind="click: disableActiveImageTool, enable: activeImageTool() !== 'none'">
            Disable active tool
          </button>
          <button class="btn btn-xs btn-default"
                  data-bind="click: clearLeafletMeasure, enable: leafletMeasureMode">
            Clear
          </button>
        </div>
        <!-- ko if: annotationStatus -->
        <div style="font-size:12px; margin-top:6px; color:#333;" data-bind="text: annotationStatus"></div>
        <!-- /ko -->
        <!-- ko if: leafletMeasureDistance -->
        <div style="font-size:12px; margin-top:6px;">
          Pixel distance: <b data-bind="text: leafletMeasureDistance"></b>
        </div>
        <!-- /ko -->
        <!-- ko if: elevationValue -->
        <div style="font-size:12px; margin-top:4px;">
          Elevation: <b data-bind="text: elevationValue"></b>
        </div>
        <!-- /ko -->        
      <!-- /ko -->
    </div>
  </div>
</div>
