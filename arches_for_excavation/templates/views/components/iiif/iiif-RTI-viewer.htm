<div class="iiif-rti-viewer" data-bind="rtiViewerInit: initViewer">
    <div class="iiif-rti-openlime openlime"></div>

    <div class="iiif-rti-crop-overlay"
         data-bind="visible: cropEnabled, event: { mousedown: beginCrop }">
        <div class="iiif-rti-crop-selection"
             data-bind="visible: cropDrag, style: cropSelectionStyle"></div>
    </div>

    <div class="iiif-rti-status" data-bind="visible: error">
        <span data-bind="text: error"></span>
    </div>

    <div class="iiif-rti-loading" data-bind="visible: status">
        <span data-bind="text: status"></span>
    </div>

    <div class="iiif-rti-help" tabindex="0" aria-label="RTI mouse controls">
        <span class="iiif-rti-help-icon">i</span>
        <span class="iiif-rti-help-tooltip">
            LMB = light control<br>
            RMB = pan control
        </span>
    </div>
</div>
