<div class="iiif-rti-viewer" data-bind="rtiViewerInit: initViewer">
    <div class="iiif-rti-openlime openlime"></div>

    <div class="iiif-rti-crop-overlay"
         data-bind="visible: cropEnabled, event: { mousedown: beginCrop }">
        <div class="iiif-rti-crop-selection"
             data-bind="visible: cropDrag, style: cropSelectionStyle"></div>
    </div>

    <div class="iiif-rti-status" data-bind="visible: error">
        <span data-bind="text: error"></span>
    </div>

    <div class="iiif-rti-loading" data-bind="visible: status">
        <span data-bind="text: status"></span>
    </div>

    <div class="iiif-rti-help" tabindex="0" aria-label="RTI mouse controls">
        <span class="iiif-rti-help-icon">i</span>
        <span class="iiif-rti-help-tooltip">
            LMB = light control<br>
            RMB = pan control
        </span>
    </div>
</div>

<style>
    .iiif-rti-viewer {
        position: relative;
        width: 100%;
        height: 640px;
        overflow: hidden;
        background: #050505;
    }

    .iiif-rti-openlime {
        position: relative;
        width: 100%;
        height: 100%;
    }

    .iiif-rti-crop-overlay {
        position: absolute;
        inset: 0;
        z-index: 80;
        cursor: crosshair;
        background: rgba(0, 0, 0, 0.05);
    }

    .iiif-rti-crop-selection {
        position: absolute;
        border: 2px solid #fff;
        background: rgba(74, 180, 212, 0.22);
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.28);
        pointer-events: none;
    }

    .iiif-rti-status,
    .iiif-rti-loading {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 12px;
        z-index: 100;
        padding: 10px 12px;
        font: 13px/1.4 system-ui, sans-serif;
    }

    .iiif-rti-status {
        border: 1px solid #6f2f2f;
        background: rgba(30, 10, 10, 0.92);
        color: #f5dede;
    }

    .iiif-rti-loading {
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(10, 10, 10, 0.84);
        color: #f2f2f2;
    }

    .iiif-rti-help {
        position: absolute;
        left: 12px;
        bottom: 12px;
        z-index: 90;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border: 1px solid rgba(255, 255, 255, 0.42);
        border-radius: 50%;
        background: rgba(8, 8, 8, 0.72);
        color: #fff;
        cursor: help;
        font: 700 16px/1 system-ui, sans-serif;
        outline: none;
    }

    .iiif-rti-help:focus {
        border-color: rgba(255, 255, 255, 0.78);
        box-shadow: 0 0 0 2px rgba(74, 180, 212, 0.5);
    }

    .iiif-rti-help-tooltip {
        position: absolute;
        left: 0;
        bottom: 36px;
        min-width: 150px;
        padding: 8px 10px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(8, 8, 8, 0.92);
        color: #f7f7f7;
        font: 12px/1.35 system-ui, sans-serif;
        opacity: 0;
        pointer-events: none;
        transform: translateY(4px);
        transition: opacity 120ms ease, transform 120ms ease;
        white-space: nowrap;
    }

    .iiif-rti-help:hover .iiif-rti-help-tooltip,
    .iiif-rti-help:focus .iiif-rti-help-tooltip {
        opacity: 1;
        transform: translateY(0);
    }
</style>
