<!-- media/js/templates/views/components/workflows/iiif/resource-selection-step.htm -->
<div class="workflow-step">
    <div class="form-group">
        <label>Find resource</label>
        <input type="text"
               class="form-control"
               placeholder="Type to search…"
               data-bind="value: searchText, valueUpdate: 'afterkeydown'">
        <small class="text-muted">
            Start typing name / label; list below will update.
        </small>
    </div>

    <div class="form-group" style="margin-top: 1rem;">
        <label>Select resource</label>
        <select class="form-control"
                data-bind="options: availableResources,
                           optionsText: 'label',
                           optionsValue: 'id',
                           value: selectedResourceId,
                           optionsCaption: '— choose resource —'">
        </select>
    </div>

    <div class="form-group" style="margin-top: .5rem;"
         data-bind="visible: selectedResourceId">
        <strong>Selected ID:</strong>
        <code data-bind="text: selectedResourceId"></code>
    </div>
</div>
