<style>
    .spinning {
        -webkit-animation: spin 2s linear infinite;
        -moz-animation: spin 2s linear infinite;
        -ms-animation: spin 2s linear infinite;
        -o-animation: spin 2s linear infinite;
        animation: spin 2s linear infinite;
    }
    @-webkit-keyframes spin {
        0% { -webkit-transform: rotate(0deg); }
        100% { -webkit-transform: rotate(360deg); }
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>

<section class="workflow-step">
    <h3 data-bind="text: stepTitle"></h3>
    <p class="text-muted" data-bind="visible: stepDescription, text: stepDescription"></p>

    <div class="alert alert-info" data-bind="visible: digitalResourceId">
        <strong>Selected IIIF resource:</strong>
        <code data-bind="text: digitalResourceId"></code>
        <span data-bind="visible: resourceName">
            —
            <span data-bind="text: resourceName"></span>
        </span>
    </div>

    <div class="alert alert-warning" data-bind="visible: loading">
        Loading resource context...
    </div>

    <div class="form-group" style="margin-top:10px;">
      <label>Upload mode</label>
      <div>
        <label class="radio-inline">
          <input type="radio" name="iiif-upload-mode" value="geotiff" data-bind="checked: uploadMode, disable: modeLocked"> GeoTIFF (DEM/Ortho)
        </label>
        <label class="radio-inline">
          <input type="radio" name="iiif-upload-mode" value="photo" data-bind="checked: uploadMode, disable: modeLocked"> Photo (JPG/PNG)
        </label>
      </div>
      <small class="text-muted" data-bind="visible: isPhotoMode">Photo mode uses IIIF Image API without DEM processing.</small>
    </div>

    <div class="panel panel-default" style="margin-top:10px;">
        <div class="panel-body"
             style="border:1px dashed #999; padding:20px; text-align:center;"
             data-bind="dropzone: dropzoneOptionsCreate">
            <button type="button" class="btn btn-default fileinput-create-button">
                Choose file…
            </button>
            <div id="hidden-dz-append-previews" style="display:none;"></div>
        </div>
    </div>

    <div class="panel panel-default" style="margin-top:10px;" data-bind="visible: queue().length > 0">
      <div class="panel-heading"><strong>Selected files</strong></div>
      <div class="panel-body" style="padding:0;">
        <table class="table table-striped table-condensed" style="margin:0;">
          <thead>
            <tr>
              <th>Name</th>
              <th>Size</th>
              <th>Status</th>
              <th style="width:120px;" data-bind="visible: !$component.isPhotoMode()">Is DEM</th>
              <th style="width:110px;">Action</th>
            </tr>
          </thead>
          <tbody data-bind="foreach: queue">
            <tr>
              <td data-bind="text: name"></td>
              <td data-bind="text: $parent.humanSize(file && file.size)"></td>
              <td><span class="label label-default" data-bind="text: statusObs()"></span></td>
              <td data-bind="visible: !$component.isPhotoMode()">
                <button type="button"
                        class="btn btn-xs"
                        data-bind="
                          css: isDemObs() ? 'btn-primary' : 'btn-default',
                          text: isDemObs() ? 'DEM' : 'Ortho',
                          click: function(){ $component.toggleDem($data); },
                          enable: $component.canToggleDem($data)">
                </button>
              </td>
              <td>
                <button type="button"
                        class="btn btn-xs btn-danger"
                        data-bind="click: function(){ $component.removeFileRow($data); }, enable: $component.canRemoveFile($data)">
                  Remove
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div data-bind="visible: progressPhase() === 'ready'" style="margin-top:10px; text-align:center;">
        <p style="color: #5cb85c; font-weight: bold;" data-bind="text: progressStatus"></p>
        <button type="button" class="btn btn-success" data-bind="click: startUpload">
            Start Upload
        </button>
    </div>

    <div data-bind="visible: progressPhase() === 'uploading' || progressPhase() === 'processing'" style="margin-top:10px;">
        <p data-bind="text: progressStatus"></p>
        <div class="progress">
            <div class="progress-bar progress-bar-striped active" role="progressbar" style="width: 100%">
                <span class="glyphicon glyphicon-refresh spinning"></span> Processing...
            </div>
        </div>
    </div>

    <div data-bind="visible: progressPhase() === 'complete'" class="alert alert-success" style="margin-top:10px;">
        <span class="glyphicon glyphicon-ok"></span>
        <strong>Success!</strong> Files processed and appended to the existing manifest.
        <p style="margin-top:8px;" data-bind="text: progressStatus"></p>
    </div>

    <div data-bind="visible: errorMessage" class="alert alert-danger" style="margin-top:10px;">
        <span data-bind="text: errorMessage"></span>
    </div>
</section>
