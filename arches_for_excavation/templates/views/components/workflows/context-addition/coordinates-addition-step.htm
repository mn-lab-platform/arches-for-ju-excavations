<style>
.context-coordinates-wrapper {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
}

.content-wrapper {
    flex-grow: 1;

    display: flex;
}

.input-wrapper {
    width: 80%;

    position: relative;
}

.editable-textarea {
    width: 100%;
    height: 100%;

    resize: none;
    font-family: "Fira Mono", "Consolas", "Menlo", "Monaco", "Liberation Mono", "Courier New", monospace;
    font-weight: 600;
    font-size: 1.5rem;
    line-height: 1.8rem;

    border-radius: 4px;
    padding: 1rem;

    overflow: auto;
    white-space: pre-wrap;
    word-wrap: break-word;

    outline: none;
    border: 1px solid #ccc;
}

.error-indicator {
    display: none; 
    color: red;
    font-weight: bold;
    margin-left: 0.5rem;
}

.error-indicator.visible {
    display: inline; 
}


.controls-wrapper {
    width: 20%;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
}

</style>
<div class="context-coordinates-wrapper">
    <div data-bind="visible: errorMessage" class="alert alert-danger">
        <span data-bind="text: errorMessage"></span>
    </div>
    <div data-bind="visible: successMessage" class="alert alert-success">
        <span data-bind="text: successMessage"></span>
    </div>
    <div class="content-wrapper">
        <div class="input-wrapper">
            <div class="editable-textarea" 
                 contenteditable="true" 
                 data-bind="html: coordinatesHtml, event: { input: handleCoordinatesInput }">
            </div>
        </div>
        <div class="controls-wrapper">
            <button type="button" 
                data-bind="disable: !coordinatesValid(), click: reorderCoordinates"
                title="Reorder X and Y coordinates"
                >
                Reorder XY
            </button>
            <button type="button" 
                data-bind="disable: !coordinatesValid()"
                title="Submit coordinates"
                >
                Submit
            </button>
        </div>
    </div>
</div>
