<style>
.workflow-tab-controls {
    display: none;
}

.spinning {
    -webkit-animation: spin 2s linear infinite;
    -moz-animation: spin 2s linear infinite;
    -ms-animation: spin 2s linear infinite;
    -o-animation: spin 2s linear infinite;
    animation: spin 2s linear infinite;
}

@-webkit-keyframes spin {
    0% { -webkit-transform: rotate(0deg); }
    100% { -webkit-transform: rotate(360deg); }
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.context-confirmation-wrapper {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
    /* align-items: center;
    justify-content: center;  */
}

.context-confirmation-container {
    height: 75%;

    display: flex;
    align-items: center;
    justify-content: center;
}

.geojson-display {
    width: 50%;
    height: 100%;
    margin-right: 1rem;
}

.geojson-pre {
    height: 100%;
    overflow-y: auto;
    padding: 2rem;
}

.plain-text-display {
    width: 50%;
    height: 100%;
}

.plain-text-display textarea {
    width: 100%;
    height: 100%;
    resize: none;
}

.save-button {
    margin-top: 3rem;
    font-size: 2rem;

    align-self: flex-end;
}

@media (max-width: 700px) {
    .context-confirmation-container {
        flex-direction: column;
        height: auto;
    }
    .geojson-display, .plain-text-display {
        width: 100%;
        height: 300px;
        margin: 0 0 1rem 0;
    }
}

</style>

<div class="context-confirmation-wrapper">
    <h3>Verify the footprint and save</h3>
    <div data-bind="visible: infoMessage" class="alert alert-info">
        <span data-bind="visible: isLoading" class="glyphicon glyphicon-refresh spinning"></span> 
        <span data-bind="text: infoMessage"></span>
    </div>
    <div data-bind="visible: errorMessage" class="alert alert-danger">
        <span data-bind="text: errorMessage"></span>
    </div>
    <div data-bind="visible: successMessage" class="alert alert-success">
        <span data-bind="text: successMessage"></span>
    </div>
    <div class="context-confirmation-container">
        <div class="geojson-display">
            <pre class="geojson-pre" data-bind="text: geojsonString"></pre>
        </div>
        <div class="plain-text-display">
            <textarea name="plain-text-display" id="plain-text-display" data-bind="value: coordinatesText" readonly></textarea>
        </div>
    </div>
    <button id="submit-button"
            type="button" 
            class="btn btn-success save-button" 
            data-bind="click: saveFootprint, enable: geojsonString() && !footprintSaved()">
            Add to Resource
    </button>
</div>
