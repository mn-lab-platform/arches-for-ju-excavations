<style>
.workflow-tab-controls {
    display: none;
}
.tabbed-workflow-step-container {
    overflow-y: auto;
}
.workflow-nav-tabs {
    overflow-x: auto;
}
.context-coordinates-wrapper {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
}

.content-wrapper {
    flex-grow: 1;

    display: flex;
}

.input-wrapper {
    width: 90%;

    position: relative;
}

.editable-textarea {
    width: 100%;
    height: 100%;

    resize: none;
    font-family: "Fira Mono", "Consolas", "Menlo", "Monaco", "Liberation Mono", "Courier New", monospace;
    font-weight: 600;
    font-size: 1.5rem;
    line-height: 1.8rem;

    border-radius: 4px;
    padding: 1rem;

    overflow: auto;
    white-space: pre-wrap;
    word-wrap: break-word;

    outline: none;
    border: 1px solid #ccc;
}

.ignore-line-indicator {
    display: none; 
    font-weight: bold;
    margin-left: 0.5rem;
}

.ignore-line-indicator.visible {
    display: inline; 
}

.error-indicator {
    display: none; 
    font-weight: bold;
    margin-left: 0.5rem;
}

.error-indicator.visible {
    display: inline; 
}

.controls-wrapper {
    width: 10%;

    display: flex;
    flex-direction: column;
    gap: 5rem;

    padding-left: 3rem;
}

.context-control-button {
    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    width: 36px;
    height: 36px;

    border-radius: 50%;
    border: none;

    background-color: transparent;

    transition: all 0.2s ease-in-out; 
    padding: 0; 
}

.context-control-button:hover {
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.10); 
    transform: translateY(-2px); 
    background-color: rgba(217, 217, 242, 0.7); 
}

.context-control-button.active {
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.10);
    background-color: rgba(217, 217, 242, 0.7);  
}

.context-control-button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none;
    background-color: transparent;
    transform: none;
    pointer-events: none;
}

@media (max-width: 700px) {
    .content-wrapper {
        flex-direction: column;
    }

    .input-wrapper {
        width: 100%;
        height: 70%;
    }

    .controls-wrapper {
        width: 100%;
        height: 30%;

        flex-direction: row;
        justify-content: center;
        padding-left: 0;
        gap: 2rem;
    }

}

</style>
<div class="context-coordinates-wrapper">
    <div data-bind="visible: errorMessage" class="alert alert-danger">
        <span data-bind="text: errorMessage"></span>
    </div>
    <div data-bind="visible: successMessage" class="alert alert-success">
        <span data-bind="text: successMessage"></span>
    </div>
    <div class="content-wrapper">
        <div class="input-wrapper">
            <div class="editable-textarea" 
                 contenteditable="true" 
                 data-bind="html: coordinatesHtml, event: { input: handleCoordinatesInput }">
            </div>
        </div>
        <div class="controls-wrapper">
            <button type="button" 
                class="context-control-button"
                data-bind="disable: !coordinatesValid(), click: reorderCoordinates"
                title="Reorder X and Y coordinates"
                >
                <img src="/static/img/context_workflow/reorder_icon.svg" alt="Reorder X and Y coordinates">
            </button>
            <button type="button" 
                class="context-control-button"
                data-bind="css: { active: ignoreLastLine() }, click: toggleIgnoreLastLine"
                title="Ignore last line"
                >
                <img src="/static/img/context_workflow/skip_last_line_icon.svg" alt="Ignore last line">
            </button>
        </div>
    </div>
</div>
