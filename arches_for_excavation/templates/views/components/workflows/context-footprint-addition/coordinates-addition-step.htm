<style>
.workflow-tab-controls {
    display: none;
}
.tabbed-workflow-step-container {
    overflow-y: auto;
}
.workflow-nav-tabs {
    overflow-x: auto;
}
.context-coordinates-wrapper {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
}

.content-wrapper {
    flex-grow: 1;

    display: flex;
}

.input-wrapper {
    width: 82%;

    position: relative;
}

.editable-textarea {
    width: 100%;
    height: 100%;

    resize: none;
    font-family: "Fira Mono", "Consolas", "Menlo", "Monaco", "Liberation Mono", "Courier New", monospace;
    font-weight: 600;
    font-size: 1.5rem;
    line-height: 1.8rem;

    border-radius: 4px;
    padding: 1rem;

    overflow: auto;
    white-space: pre-wrap;
    word-wrap: break-word;

    outline: none;
    border: 1px solid #ccc;
}

.ignore-line-indicator {
    display: none; 
    font-weight: bold;
    margin-left: 0.5rem;
}

.ignore-line-indicator.visible {
    display: inline; 
}

.error-indicator {
    display: none; 
    font-weight: bold;
    margin-left: 0.5rem;
}

.error-indicator.visible {
    display: inline; 
}

.controls-wrapper {
    width: 18%;

    display: flex;
    flex-direction: column;
    gap: 5rem;

    padding-left: 3rem;
}

.context-control-button {
    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
    font-weight: 600;

    border: 1px solid #c7d2df;
    border-radius: 4px;
    background-color: #fff;

    padding: 0.5em;

    transition: all 0.2s ease; 
}

.context-control-button:hover {
    background-color: #eef4fa;
    border-color: #4a90e2;
}

.context-control-button.active {
    background-color: #e3effc;
    border-color: #4a90e2;
    color: #245b91;
}

.context-control-button:disabled,
.context-control-button:disabled:hover {
    opacity: 0.5;
    cursor: not-allowed;
    background-color: #f5f5f5;
    border-color: #c7d2df;
    color: inherit;
}

.selected-resource-banner {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    margin-bottom: 1rem;
    padding: 0.9rem 1.1rem;
    border-left: 4px solid #4a90e2;
    background: #f4f8fc;
}

.selected-resource-heading {
    flex: 0 0 auto;
    margin: 0;
    color: #5f6b78;
    font-size: 0.9em;
    font-weight: 600;
}

.selected-resource-name {
    font-size: 1.1em;
    font-weight: 600;
    color: #1f2933;
}

.selected-resource-type {
    margin: 0;
    color: #5f6b78;
    font-size: 0.95em;
}

@media (max-width: 700px) {
    .content-wrapper {
        flex-direction: column;
    }

    .input-wrapper {
        width: 100%;
        height: 70%;
    }

    .controls-wrapper {
        width: 100%;
        height: 30%;

        flex-direction: row;
        justify-content: center;
        padding-left: 0;
        gap: 2rem;
    }
    .selected-resource-banner {
        align-items: flex-start;
        flex-direction: column;
        gap: 0.2rem;
    }

    .context-control-button {
        min-width: 0;
        flex: 1;
        white-space: normal;
        text-align: center;
    }
}

</style>
<div class="context-coordinates-wrapper">
    <div class="selected-resource-banner"
        data-bind="visible: resourceDisplayName">
        <div class="selected-resource-heading">Adding coordinates to:</div>
        <div class="selected-resource-name"
            data-bind="text: resourceDisplayName"></div>
        <div class="selected-resource-type">
            (<span data-bind="text: resourceTypeLabel"></span>)
        </div>
    </div>
    <div data-bind="visible: errorMessage" class="alert alert-danger">
        <span data-bind="text: errorMessage"></span>
    </div>
    <div data-bind="visible: infoMessage" class="alert alert-info">
        <span data-bind="text: infoMessage"></span>
    </div>
    <div data-bind="visible: successMessage" class="alert alert-success">
        <span data-bind="text: successMessage"></span>
    </div>
    <div class="content-wrapper">
        <div class="input-wrapper">
            <div class="editable-textarea" 
                 contenteditable="plaintext-only" 
                 data-bind="html: coordinatesHtml, event: { input: handleCoordinatesInput }">
            </div>
        </div>
        <div class="controls-wrapper">
            <button type="button"
                    class="context-control-button"
                    data-bind="disable: !coordinatesValid(), click: reorderCoordinates"
                    title="Reorder X and Y coordinates">
                Reorder X and Y coordinates
            </button>
            <button type="button"
                class="context-control-button"
                data-bind="css: { active: ignoreLastLine() }, click: toggleIgnoreLastLine"
                title="Ignore last line">
            Ignore last line
        </button>
        </div>
    </div>
</div>
