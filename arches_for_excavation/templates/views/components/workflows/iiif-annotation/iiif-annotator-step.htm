<div class="workflow-step-container">
  <h4>IIIF Annotator</h4>

  <!-- status -->
  <div data-bind="visible: loading" class="alert alert-info" style="margin-bottom: 10px;">
    Loading manifest…
  </div>

  <div data-bind="visible: error" class="alert alert-danger" style="margin-bottom: 10px;">
    <strong>Error:</strong>
    <span data-bind="text: error"></span>
  </div>

  <div data-bind="visible: !manifest() && !loading() && !error()" class="alert alert-warning" style="margin-bottom: 10px;">
    Manifest not loaded yet.
  </div>

  <!-- map viewer -->
  <div data-bind="if: manifest">
    <div style="height:780px; border: 1px solid #ddd; border-radius: 6px; overflow:hidden; margin-bottom: 12px;">
      <!--
        IMPORTANT:
        - iiif-map-viewer expects params.manifest (IIIF v3)
        - callbacks are forwarded for when you add drawing support inside the viewer
      -->
      <iiif-map-viewer params="
        manifest: manifest,
        existingAnnotations: existingAnnotations,
        onAnnotationCreated: handleNewAnnotation,
        onAnnotationDeleted: handleAnnotationDeleted
      "></iiif-map-viewer>
    </div>

    <div style="display:flex; gap:10px; align-items:center;">
      <button class="btn btn-primary"
              data-bind="click: openFinalizeModal, enable: newAnnotations().length > 0">
        Finalize output
      </button>

      <span class="text-muted" data-bind="visible: newAnnotations().length === 0">
        Draw at least one new annotation to enable finalize.
      </span>

      <span class="text-info" data-bind="visible: newAnnotations().length > 0">
        New annotations pending: <strong data-bind="text: newAnnotations().length"></strong>
      </span>
    </div>
  </div>

  <!-- finalize modal -->
  <div class="wf-modal-backdrop" data-bind="visible: showFinalizeModal, click: cancelFinalizeModal"></div>
  <div class="wf-modal" data-bind="visible: showFinalizeModal">
    <div class="wf-modal-card">
      <div class="wf-modal-header"><h4>Finalize output</h4></div>
      <div class="wf-modal-body">
        <div class="form-group">
          <label>Save Mode</label>
          <select class="form-control" data-bind="value: outputMode">
            <option value="annotation-only">Annotation Only</option>
            <option value="annotation-and-resource">Create New Resource</option>
          </select>
        </div>
      </div>
      <div class="wf-modal-footer">
        <button class="btn btn-default" data-bind="click: cancelFinalizeModal">Cancel</button>
        <button class="btn btn-success" data-bind="click: confirmFinalizeModal">Confirm</button>
      </div>
    </div>
  </div>
</div>

<style>
  .wf-modal-backdrop { position: fixed; inset:0; background:rgba(0,0,0,0.5); z-index:9000; }
  .wf-modal { position: fixed; inset:0; display:flex; justify-content:center; align-items:center; z-index:9001; }
  .wf-modal-card { background:white; width: 500px; padding: 20px; border-radius: 6px; }
</style>
