<style>
.spinning {
    -webkit-animation: spin 2s linear infinite;
    -moz-animation: spin 2s linear infinite;
    -ms-animation: spin 2s linear infinite;
    -o-animation: spin 2s linear infinite;
    animation: spin 2s linear infinite;
}

@-webkit-keyframes spin {
    0% { -webkit-transform: rotate(0deg); }
    100% { -webkit-transform: rotate(360deg); }
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

@keyframes pulse-blue {
    0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
    70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
    100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
}

.panel-body.dragover {
    animation: pulse-blue 1.5s infinite;
    border-color: #3b82f6;
    background-color: rgba(59, 130, 246, 0.05);
}

.dz-details {
    display: flex;
    align-items: center;
    flex-direction: column;
}

.dz-filename{
    font-weight: 600;
    color: #333;
    margin-bottom: 10px;
}

.dz-size {
    font-size: 0.9em;
    color: #667;
}

.dz-error-message {
    display: none;
}

.dz-error-mark {
    display: none;
}

.dz-success-mark {
    display: none;
}

.workflow-tab-controls {
    display: none;
}

.dz-remove {
    background-color: #ff6666;  
    color: #fff;                   
    border-radius: 0.3rem;
    padding: 5px 10px;
    cursor: pointer;
}

.panel-body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
    border:1px dashed #999; 
    padding:10px; 
    text-align:center;
    transition: border-color 0.3s ease, background-color 0.3s ease;
}

section {
    display: flex;
    flex-direction: column;
    unicode-bidi: isolate;
}

#submit-button {
    align-self: center;
    margin-bottom: 20px;   
}

.fileinput-geotiff-button {
    background-color: #f8f9fa;
    border: 1px solid #dee2e6;
    color: #495057;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    transition: background-color 0.2s ease, border-color 0.2s ease;
}

.fileinput-geotiff-button:hover {
    background-color: #e9ecef;
    border-color: #adb5bd;
}

.settings-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 15px;
    width: 100%;
    align-items: start; 
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group label {
    font-weight: 600;
    margin-bottom: 5px;
    font-size: 13px;
    color: #333;
}

.form-group input[type="text"],
.form-group input[type="number"] {
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 13px;
    height: 38px;
    width: 100%;
    box-sizing: border-box;
}

.numeric-field input {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 13px;
}

.visibility-options-container {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.visibility-option {
    padding: 15px;
    border: 2px solid #ddd;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
}

.visibility-option-content {
    display: flex;
    align-items: center;
    gap: 10px;
}

.visibility-option.active {
    border-color: #2563eb;
    background-color: #e6f0fa;
}

.tooltip {
    display: inline;
    position: relative;
}

.tooltip:hover {
    color: #c00;
    text-decoration: none;
}

.tooltip:hover:after {
    background: #111;
    background: rgba(0,0,0,.8);
    border-radius: .5em;
    bottom: 1.35em;
    color: #fff;
    content: attr(title);
    display: block;
    left: 1em;
    padding: .3em 1em;
    position: absolute;
    text-shadow: 0 1px 0 #000;
    white-space: nowrap;
    z-index: 98;
}

.tooltip:hover:before {
    border: solid;
    border-color: #111 transparent;
    border-color: rgba(0,0,0,.8) transparent;
    border-width: .4em .4em 0 .4em;
    bottom: 1em;
    content: "";
    display: block;
    left: 2em;
    position: absolute;
    z-index: 99;
}

/* Pure CSS Tooltip for Icons */
/* Source - https://stackoverflow.com/a/25214869 */
/* Modified for icon usage */
.info-tooltip {
    display: inline-block;
    position: relative;
    cursor: pointer;
    margin-left: 5px;
}

.info-tooltip:hover:after {
    background: rgba(0, 0, 0, .9);
    border-radius: .5em;
    bottom: 150%;
    color: #fff;
    content: attr(data-tooltip);
    display: block;
    left: 50%;
    transform: translateX(-50%);
    padding: .5em 1em;
    position: absolute;
    z-index: 9999;
    font-size: 13px;
    white-space: normal;
    width: 200px;
    text-align: center;
}

.info-tooltip:hover:before {
    border: solid rgba(0, 0, 0, .9) transparent;
    border-width: .4em .4em 0 .4em;
    bottom: calc(150% - .4em);
    content: "";
    display: block;
    left: 50%;
    transform: translateX(-50%);
    position: absolute;
    z-index: 9999;
}

.icon-picker-group {
    grid-column: 1 / -1;
    gap: 10px;
}

.icon-picker-header {
    display: flex;
    gap: 1.5rem;
    align-items: end;
}

.icon-picker-title {
    font-weight: 600;
    margin-bottom: 5px;
    font-size: 13px;
    color: #333;
}

.selected-icon-preview {
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #2563eb;
    border-radius: 4px;
    background-color: #e6f0fa;
    width: 40px;
    height: 40px;
}

.icon-search-input {
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 13px;
    height: 40px;
    width: 100%;
    box-sizing: border-box;
}

.icon-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 5px;
    max-height: 250px;
    overflow-y: auto;
    border: 1px solid #ddd;
    padding: 10px;
    border-radius: 4px;
}

.icon-option {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    border: 2px solid transparent;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
}

.icon-option i {
    font-size: 20px;
    color: #333;
}

.icon-option:hover {
    background-color: #f0f0f0;
}

.icon-option.selected-icon {
    border-color: #2563eb;
    background-color: #e6f0fa;
}

@media (max-width: 768px) {
    .settings-container {
        grid-template-columns: 1fr;
        gap: 15px;
    }

    .checkboxes-group {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
    }

    .checkbox-item {
        width: 100%;
    }
}
</style>

<section class="workflow-step">
    <h3>Upload GEOTIFF File</h3>
    <div data-bind="visible: infoMessage" class="alert alert-info">
        <span class="glyphicon glyphicon-refresh spinning"></span> 
        <span data-bind="text: infoMessage"></span>
    </div>
    <div data-bind="visible: errorMessage" class="alert alert-danger">
        <span data-bind="text: errorMessage"></span>
    </div>
    <div data-bind="visible: successMessage" class="alert alert-success">
        <span data-bind="text: successMessage"></span>
    </div>
    <div class="panel panel-default" style="margin-top:10px;">
        <div class="panel-body"
             data-bind="dropzone: dropzoneOptionsZip">
            <div id="dropzone-preview"></div>
            <button id="dropzone-button" type="button" class="fileinput-geotiff-button">
                Choose GEOTIFF file…
            </button>
        </div>
    </div>

    <div class="settings-container">
        <div class="form-group">
            <label for="basemap-name-input">Map Layer Name <span style="color:red">*</span></label>
            <input id="basemap-name-input" 
                type="text" 
                data-bind="value: basemapName, valueUpdate: 'afterkeydown'"
                placeholder="Enter map layer name">
        </div>

        <div class="form-group">
            <label for="sort-order-input">
                Sort Order 
                <span class="info-tooltip" data-tooltip="The sort order determines the position of the map layer in the list of available layers. The higher the number, lower the layer appears in the list.">
                    <i class="fa fa-info-circle"></i>
                </span>
            </label>
            <input id="sort-order-input" 
                type="number" 
                data-bind="value: sortOrder"
                placeholder="0">
        </div>

        <div class="form-group icon-picker-group">
            <div class="icon-picker-header">
                <span class="icon-picker-title">Layer Icon:</span>
                <div class="selected-icon-preview">
                    <i data-bind="attr: { class: selectedIcon }" class="icon-preview"></i>
                </div>
            </div>
            
            <input id="icon-search-input" type="text" 
                data-bind="value: iconSearchQuery, valueUpdate: 'afterkeydown'"
                class="icon-search-input"
                placeholder="Search icons (e.g., 'map', 'globe', 'tree')">
            
            <div class="icon-grid">
                <!-- ko foreach: filteredIcons -->
                <div class="icon-option"
                    data-bind="click: function() { $parent.selectIcon($data); }, css: { 'selected-icon': $data === $parent.selectedIcon() }">
                    <i data-bind="attr: { class: $data }"></i>
                </div>
                <!-- /ko -->
            </div>
        </div>
    </div>

    <button id="submit-button"
        type="button" 
        class="btn btn-primary" 
        data-bind="click: openVisibilityModal, enable: canOpenModal, text: submitLabel, attr: { title: submitTitle }"
        style="margin-top: 15px;">
    </button>

    <!-- Visibility Selection Modal -->
    <div id="visibility-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="visibilityModalTitle">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 id="visibilityModalTitle" class="modal-title">Choose Basemap Visibility</h4>
                    <button type="button" style="margin-left: auto;" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p>Who should be able to access this basemap?</p>
                    <div class="visibility-options-container">
                        <div class="visibility-option"
                             data-bind="click: function() { selectVisibility(true); }, css: { 'active': isPublic() }">
                            <div class="visibility-option-content">
                                <i class="fa fa-globe" style="font-size: 24px; color: #3b82f6;"></i>
                                <div>
                                    <strong>Public</strong>
                                    <p style="margin: 5px 0 0 0; font-size: 13px; color: #667;">
                                        Accessible to anyone on the internet
                                    </p>
                                </div>
                            </div>
                        </div>
                        <div class="visibility-option"
                             data-bind="click: function() { selectVisibility(false); }, css: { 'active': !isPublic() }">
                            <div class="visibility-option-content">
                                <i class="fa fa-lock" style="font-size: 24px; color: #667;"></i>
                                <div>
                                    <strong>Private</strong>
                                    <p style="margin: 5px 0 0 0; font-size: 13px; color: #667;">
                                        Only accessible to authorized users
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" 
                            data-bind="click: confirmVisibilityAndSubmit, enable: isPublic() !== null">
                        Confirm and Create
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>
