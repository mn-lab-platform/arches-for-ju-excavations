<style>
.workflow-tab-controls {
display: none;
}
.tabbed-workflow-step-container {
    overflow-y: auto;
}
.workflow-nav-tabs {
    overflow-x: auto;
}
.spinning {
    -webkit-animation: spin 2s linear infinite;
    -moz-animation: spin 2s linear infinite;
    -ms-animation: spin 2s linear infinite;
    -o-animation: spin 2s linear infinite;
    animation: spin 2s linear infinite;
}

@-webkit-keyframes spin {
    0% { -webkit-transform: rotate(0deg); }
    100% { -webkit-transform: rotate(360deg); }
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* Pulsating blue shadow for dragover */
@keyframes pulse-blue {
    0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
    70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
    100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
}

.panel-body.dragover {
    animation: pulse-blue 1.5s infinite;
    border-color: #3b82f6;
    background-color: rgba(59, 130, 246, 0.05);
}

/* nazwa pliku + rozmiar */
.dz-details {
display: flex;
align-items: center;
flex-direction: column;
}

/* nazwa pliku */
.dz-filename{
font-weight: 600;
color: #333;
margin-bottom: 10px;
}

/* rozmiar pliku */
.dz-size {
font-size: 0.9em;
color: #667;
}

.dz-error-message {
  display: none;
}

/* usuwanie template znaczkow */
.dz-error-mark {
display: none;
}

.dz-success-mark {
display: none;
}

/* Hide workflow tab controls */
.workflow-tab-controls {
    display: none;
}

.dz-remove {
    background-color: #ff6666;  
    color: #fff;                   
    border-radius: 0.3rem;
    padding: 5px 10px;
    cursor: pointer;
}

.panel-body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
    border:1px dashed #999; 
    padding:10px; 
    text-align:center;
    transition: border-color 0.3s ease, background-color 0.3s ease;
}

section {
    display: flex;
    flex-direction: column;
    unicode-bidi: isolate;
}

#submit-button {
    align-self: center;   
}

/* Simple button styling */
.fileinput-zip-button {
    background-color: #f8f9fa;
    border: 1px solid #dee2e6;
    color: #495057;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    transition: background-color 0.2s ease, border-color 0.2s ease;
}

.fileinput-zip-button:hover {
    background-color: #e9ecef;
    border-color: #adb5bd;
}

.settings-container {
    display: flex;
    justify-content: center;
    gap: 2rem;

    margin-bottom: 5rem;
}

.setting {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.setting-label {
    font-weight: 600;
}

</style>
<section class="workflow-step">
    <h3>Upload 3D Tiles in .zip or .3tz format</h3>
    <div data-bind="visible: infoMessage" class="alert alert-info">
        <span class="glyphicon glyphicon-refresh spinning"></span> 
        <span data-bind="text: infoMessage"></span>
    </div>
    <div data-bind="visible: errorMessage" class="alert alert-danger">
        <span data-bind="text: errorMessage"></span>
    </div>
    <div data-bind="visible: successMessage" class="alert alert-success">
        <span data-bind="text: successMessage"></span>
    </div>
    <div class="panel panel-default" style="margin-top:10px;">
        <div class="panel-body"
             data-bind="dropzone: dropzoneOptionsZip">
            <div id="dropzone-preview"></div>
            <button id="dropzone-button" type="button" class="fileinput-zip-button">
                Choose ZIP or 3TZ file…
            </button>
        </div>
    </div>
    <div class="settings-container">
        <div class="setting">
            <span class="setting-label">Model name:</span>
            <input id="model-name-input" type="text" data-bind="textInput: modelName">
        </div>
    </div>
    <button id="submit-button"
            type="button" 
            class="btn btn-primary" 
            data-bind="click: submitUpload, enable: canSubmit">
            Upload 3D Model
    </button>
</section>
