<style>
.spinning {
    -webkit-animation: spin 2s linear infinite;
    -moz-animation: spin 2s linear infinite;
    -ms-animation: spin 2s linear infinite;
    -o-animation: spin 2s linear infinite;
    animation: spin 2s linear infinite;
}

@-webkit-keyframes spin {
    0% { -webkit-transform: rotate(0deg); }
    100% { -webkit-transform: rotate(360deg); }
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* nazwa pliku + rozmiar */
.dz-details {
display: flex;
align-items: center;
flex-direction: column;
}

/* nazwa pliku */
.dz-filename{
font-weight: 600;
color: #333;
margin-bottom: 10px;
}

/* rozmiar pliku */
.dz-size {
font-size: 0.9em;
color: #667;
}

.dz-error-message {
  display: none;
}

/* usuwanie template znaczkow */
.dz-error-mark {
display: none;
}

.dz-success-mark {
display: none;
}

/* Hide workflow tab controls */
.workflow-tab-controls {
    display: none;
}

.dz-remove {
    background-color: #ff6666;  
    color: #fff;                   
    border-radius: 0.3rem;
    padding: 5px 10px;
    cursor: pointer;
}

.panel-body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
    border:1px dashed #999; 
    padding:10px; 
    text-align:center;
}

section {
    display: flex;
    flex-direction: column;
    unicode-bidi: isolate;
}

#submit-button {
    align-self: center;   
}

#georeferenced-checkbox {
    accent-color: #5bc0de;
}

</style>
<section class="workflow-step">
    <h3>Upload 3D Tiles ZIP File</h3>
    <div data-bind="visible: loading" class="text-center">
        <span class="glyphicon glyphicon-refresh spinning"></span> Uploading ZIP file…
    </div>
    <div data-bind="visible: errorMessage" class="alert alert-danger">
        <span data-bind="text: errorMessage"></span>
    </div>
    <div data-bind="visible: successMessage" class="alert alert-success">
        <span data-bind="text: successMessage"></span>
    </div>
    <div class="panel panel-default" style="margin-top:10px;">
        <div class="panel-body"
             data-bind="dropzone: dropzoneOptionsZip">
            <div id="dropzone-preview"></div>
            <button id="dropzone-button" type="button" class="btn btn-default fileinput-zip-button">
                Choose ZIP file…
            </button>
        </div>
    </div>
    <div class="form-group">
        <label>
            <input id="georeferenced-checkbox" type="checkbox" data-bind="checked: isGeoreferenced"> Georeferenced
        </label>
    </div>
    <button id="submit-button"
            type="button" 
            class="btn btn-primary" 
            data-bind="click: submitUpload, enable: canSubmit">
            Upload 3D Model
    </button>
</section>
