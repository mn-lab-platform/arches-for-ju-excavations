<style>
.workflow-tab-controls {
    display: none;
}
.tabbed-workflow-step-container {
    overflow-y: auto;
}
.workflow-nav-tabs {
    overflow-x: auto;
}

.process-selection-wrapper {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.process-options-container {
    height: 70%;
    width: 70%;

    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;

}

.process-options-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    background: #ffffff;
    border: 2px solid #d1d5db;
    border-radius: 12px;
    box-shadow: none;

    transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.25s ease;
    padding: 2rem 1.25rem;
}

.process-options-card:hover {
    cursor: pointer;
    border-color: #3b82f6;
    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.15);
    transform: translateY(-6px);
}

.process-options-card.active {
    border-color: #2563eb;
    box-shadow: 0 8px 24px rgba(59,130,246,0.22);
    background: #e6f0fa;
}

.process-options-card i {
    font-size: 6rem;
    margin-bottom: 0.75rem;
    color: #3b82f6;
}

.process-options-card h3 {
    font-size: 1.3rem;
    font-weight: 600;
    color: #1f2937;
    margin: 0;
}

.process-options-description {
    display: block;
    margin-top: 0.5rem;
    color: #374151;
    word-break: break-word;
    white-space: normal;
    text-align: center;
    max-width: 100%;
}

@media (max-width: 700px) {
    .process-options-container {
        grid-template-columns: 1fr !important;
        width: 100%;
        gap: 1rem;
    }
}

</style>


<div class="process-selection-wrapper">
    <div class="process-options-container" data-bind="foreach: cards">
        <div class="process-options-card"
            data-bind="click: function() { $parent.toggleCard($data.id); }, css: { 'active': $parent.cardId() === $data.id }">
            <i data-bind="attr: { class: $data.icon }"></i>
            <h3 data-bind="text: $data.label"></h3>
            <div data-bind="if: $data.description">
                <small class="process-options-description" data-bind="text: $data.description"></small>
            </div>
        </div>
    </div>
</div>
